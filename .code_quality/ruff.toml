# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "old",
    "env",
    ".env",
    ".venv",
    "migrations",
]

#same as black
line-length = 100
indent-width = 4

# Assume Python 3.10
target-version = "py312"

# Include ipython notebooks
extend-include = ["*.ipynb"]

[lint]
select = [
    # flake8-bugbear
    "B",
    # mccabe
    "C90",
    # pycodestyle
    "E",
    # pyflakes
    "F",
    # warnings
    "W",
    # pylint
    "PL",
    # isort
    "I",
    # flake8-bandit
    "S",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # flake8-simplify
    "SIM",
    # tryceratops
    "TRY",
    ]
ignore = [
    "E203",  # Like Black, ignore E203 (whitespace before ':') to avoid conflicts.
    "S101", # bandit: Use of `assert` detected
    "E501", # Like Black, ignore E501 (line too long) to avoid conflicts.
    "TRY003", # tryceratops: Avoid long error messages
    ]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings.
docstring-code-format = true

[lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[lint.isort]
known-third-party = ["fastapi", "pydantic"]

[lint.per-file-ignores]
# Literal expected values (row counts, thresholds, fixture numbers) are the point of an
# assertion, not a magic number smell. S311: fixtures seed deterministic RNGs, not
# crypto. S105/S106: redaction tests compare against the "***REDACTED***" sentinel.
# S108: in-memory / throwaway "/tmp" paths in config tests.
"tests/**" = ["PLR2004", "S311", "S105", "S106", "S108"]
# B008: FastAPI's whole DI model is `param = Depends(...)` / `Query(...)` in the
# signature default -- the function call there is the intended API, not a bug.
"src/api/**" = ["B008"]
# The pilot measurement scripts (T-159a): the reviewer B evidence scripts of the T-143 part A
# finding, kept as they were written (one-liners, module-level code) so the measurement they
# produce is the reviewer's, not a rewrite of it. E402/E401/I001: the imports follow the
# docstring; SIM115: the scripts open their files without a context manager; PLR2004: the
# duration thresholds (351, 119, 80, 371 days) are the SEC's own buckets; B007/B023/E731/E741:
# the loops bind their names the way the measurement reads them; S310/S314: the raw XML read.
"scripts/pilot_a/**" = [
    "B007",
    "B023",
    "E401",
    "E402",
    "E731",
    "E741",
    "I001",
    "PLC0206",
    "PLR2004",
    "S310",
    "S314",
    "SIM115",
]
