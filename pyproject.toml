[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-financial-analysis"
version = "0.1.0"
description = "Portfolio financial analysis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Shared DB layer: the SQLite connect() factory + the kg_schema analysis-DB
    # contract (DDL / migrations / v_* views / env / universe.db reads /
    # coverage / provenance), imported as `portfolio_common.kg_schema`. Pinned
    # by tag in [tool.uv.sources]; bump the tag to adopt a new schema contract.
    "portfolio-common",
    "strands-agents[openai]>=0.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    # api/: read-only FastAPI over the v_* read-contract views + universe.db.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # quant/: Markowitz mean-variance optimizer. First numeric deps in the repo;
    # kept off every other package's import path (see tests/test_quant_import_isolation.py).
    "numpy>=2.0,<3",
    "scipy>=1.13",
    "cvxpy>=1.6",
    "clarabel>=0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "commitizen>=4.17",
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

# Not published anywhere -- but installed (editable) into the uv env so every
# `src/<pkg>` imports and runs as `python -m <pkg>` from any directory.
[tool.hatch.build.targets.wheel]
packages = [
    "src/fundamental_agent",
    "src/pricing_agent",
    "src/cycle",
    "src/entity_resolution",
    "src/quant",
    "src/api",
]

[tool.uv.sources]
# The shared DB layer lives in its own repo (github.com/gamug/portfolio-common)
# as `portfolio_common.kg_schema`, pinned by tag -- bump the tag here to adopt a
# new schema/universe contract. For local work against a checkout next to this
# repo, override with an editable path source:
#   portfolio-common = { path = "../portfolio-common", editable = true }
portfolio-common = { git = "https://github.com/gamug/portfolio-common", tag = "v0.2.0" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
major_version_zero = true
update_changelog_on_bump = true
