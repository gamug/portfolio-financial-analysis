[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portfolio-finantial-analysis"
version = "0.1.0"
description = "Portfolio financial analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents[openai]>=0.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "commitizen>=4.17",
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

# Not published anywhere -- but installed (editable) into the uv env so every
# `src/<pkg>` imports and runs as `python -m <pkg>` from any directory.
[tool.hatch.build.targets.wheel]
packages = [
    "src/fundamental_agent",
    "src/pricing_agent",
    "src/kg_schema",
    "src/cycle",
    "src/entity_resolution",
    "src/backtest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
major_version_zero = true
update_changelog_on_bump = true
